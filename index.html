<!DOCTYPE html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CompuCare · Prototipo académico</title><style>
*{box-sizing:border-box}body{margin:0;background:#F6F8F7;color:#112D35;font:16px Arial,sans-serif}header{background:#112D35;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}header b{font-size:26px}select,input,textarea,button{font:inherit;border-radius:7px;padding:12px;border:1px solid #90A9A5}button,a{cursor:pointer}button{background:#087F75;color:white;border:0;min-height:44px}button.secondary{background:white;color:#087F75;border:1px solid #087F75}nav{padding:16px 5%;background:white;display:flex;gap:10px;flex-wrap:wrap}nav button{background:#EEF5F1;color:#112D35}main{max-width:1100px;margin:35px auto;padding:0 24px}h1{font-size:34px}p{line-height:1.6}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}article{background:white;border:1px solid #D7E2DE;border-radius:12px;padding:24px}article h2{font-size:20px;margin-top:0}.notice{background:#C7F1C8;padding:16px;border-radius:8px;margin:15px 0}.error{background:#FBE9E7;color:#8B2424}form{max-width:650px}label{display:block;margin:18px 0}input,textarea{width:100%;margin-top:8px}textarea{min-height:100px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}footer{padding:35px 5%;font-size:13px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #1B64A5;outline-offset:3px}.hero{background:#112D35;color:white;padding:55px 30px;border-radius:18px}.hero h1{font-size:44px;max-width:700px}.pill{color:#087F75;font-weight:bold}@media(max-width:650px){.cards{grid-template-columns:1fr}h1{font-size:28px}.hero h1{font-size:34px}header{padding:16px}main{padding:0 16px}nav{gap:6px}nav button{font-size:14px;padding:10px}}
</style><header><b>CompuCare</b><label style="margin:0">Vista de demostración <select id="role"><option>Visitante</option><option>Responsable</option><option>Empleado</option><option>Técnico</option><option>Administrador</option></select></label></header><nav id="nav"></nav><main id="app"></main><footer>UniLink · Prototipo académico con datos ficticios. No procesa pagos ni crea cuentas reales. <button class="secondary" onclick="resetDemo()">Reiniciar demo</button></footer><script>
const screens=[["01_acceso", "Iniciar sesión", "Todos", [["Correo electrónico", "nombre@empresa.pe"], ["Contraseña", "••••••••••"], ["Acción", "Ingresar a CompuCare"], ["Ayuda", "Olvidé mi contraseña"]]], ["02_registro", "Registrar empresa", "Visitante", [["Razón social", "Empresa de demostración"], ["RUC y contacto", "Datos de la empresa y responsable"], ["Correo y contraseña", "Crear acceso del responsable"], ["Acción", "Solicitar registro de empresa"]]], ["03_recuperacion", "Recuperar acceso", "Todos", [["Correo electrónico", "nombre@empresa.pe"], ["Instrucción", "Te enviaremos un enlace si la cuenta existe"], ["Acción", "Solicitar enlace"], ["Volver", "Regresar al inicio de sesión"]]], ["04_panel", "Panel de la empresa", "Responsable", [["Soporte correctivo", "6 h disponibles de 8 h"], ["Mantenimiento preventivo", "1 equipo disponible de 2"], ["Solicitudes activas", "3 en proceso · 1 pendiente de aprobación"], ["Acción", "Ver solicitudes de mi empresa"]]], ["05_solicitudes", "Solicitudes", "Empleado", [["CC-001 · PC-014", "No enciende · Técnico asignado"], ["CC-002 · LAP-008", "Sistema lento · En diagnóstico"], ["Filtros", "Estado · Equipo · Fecha"], ["Acción", "Nueva solicitud"]]], ["06_nueva", "Nueva solicitud", "Empleado", [["Equipo", "PC-014 · Administración"], ["Ubicación", "Sede Central · Piso 2 · Puesto 14"], ["Problema", "La computadora no enciende"], ["Acción", "Enviar solicitud"]]], ["07_detalle", "Detalle CC-001", "Empresa / Técnico", [["Técnico asignado", "Andrea · Soporte UniLink"], ["Estado", "En espera de aprobación"], ["Diagnóstico", "Requiere cambio de fuente de poder"], ["Actividad", "Solicitud registrada → Diagnóstico realizado"]]], ["08_equipos", "Equipos e historial", "Responsable", [["PC-014 · Administración", "Sede Central · Piso 2"], ["Historial del equipo", "Mantenimiento preventivo · Servicio completado"], ["Última intervención", "Diagnóstico de encendido · CC-001"], ["Acción", "Registrar equipo"]]], ["09_cobertura", "Mi suscripción", "Responsable", [["Plan Empresarial", "8 h correctivas + 2 mantenimientos por mes"], ["Saldo del periodo", "6 h correctivas · 1 mantenimiento"], ["Reserva pendiente", "0 h · 0 mantenimientos"], ["Acción", "Ver consumo del periodo"]]], ["10_cotizacion", "Cotización adicional", "Responsable", [["CC-001 · Versión 1", "Fuente de poder · 1 unidad · S/ 180.00"], ["Mano de obra adicional", "30 minutos · S/ 1.00/min · S/ 30.00"], ["Total de demostración", "S/ 210.00 · Incluye todo el importe a aprobar"], ["Acción", "Aprobar S/ 210.00 | Rechazar"]]], ["11_asignadas", "Mis atenciones", "Técnico", [["CC-001 · PC-014", "En espera de aprobación · Empresa demo"], ["CC-003 · LAP-002", "Asignada · Atención remota"], ["Próxima acción", "Abrir diagnóstico y comprobar cobertura"], ["Acción", "Ver detalle CC-003"]]], ["12_intervencion", "Registrar intervención", "Técnico", [["Tipo de trabajo", "Soporte correctivo"], ["Tiempo trabajado", "60 minutos · Dentro de la reserva autorizada"], ["Solución aplicada", "Configuración del sistema y prueba funcional"], ["Acción", "Enviar para validación"]]], ["13_asignacion", "Asignar técnico", "Administrador", [["Solicitud", "CC-003 · Equipo LAP-002"], ["Técnico disponible", "Andrea · Soporte de computadoras"], ["Modalidad", "Remota · Coordinación con la empresa"], ["Acción", "Confirmar asignación"]]], ["14_validacion", "Validar atención", "Administrador", [["Intervención enviada", "CC-003 · 60 minutos correctivos"], ["Cobertura", "60 minutos reservados · Sin cobro adicional"], ["Control", "Validar una sola vez y actualizar historial"], ["Acción", "Validar consumo y cerrar"]]], ["15_empleados", "Empleados de empresa", "Responsable", [["Miembros activos", "Ana · Empleada | Luis · Responsable"], ["Invitación", "Correo del nuevo empleado"], ["Permisos", "El empleado consulta sus propias solicitudes"], ["Acción", "Enviar invitación"]]], ["16_gestion", "Gestión de UniLink", "Administrador", [["Empresas", "Demo S.A.C. · Suscripción activa"], ["Planes", "Básico · Empresarial · Integral"], ["Técnicos", "Andrea · Activa y disponible"], ["Acción", "Gestionar planes, empresas y técnicos"]]]];
let role='Visitante', state={quote:'Pendiente',ticket:'En espera de aprobación',balance:360,validated:false,assigned:false,created:false};
const app=document.getElementById('app'),nav=document.getElementById('nav');
const access={Visitante:['landing',0,1,2],Responsable:[3,4,6,7,8,9,14],Empleado:[4,5,6],Técnico:[10,6,11],Administrador:[15,12,13,6]};
function resetDemo(){state={quote:'Pendiente',ticket:'En espera de aprobación',balance:360,validated:false,assigned:false,created:false};go(access[role][0]);}
function link(text,id){return `<button onclick="go(${typeof id==='number'?id:"'"+id+"'"})">${text}</button>`}
function menu(){nav.innerHTML=access[role].map(i=>link(i==='landing'?'Inicio':screens[i][1],i)).join('')}
document.getElementById('role').onchange=e=>{role=e.target.value;menu();go(access[role][0])};
function message(text,error=false){document.getElementById('message').innerHTML=`<div class="notice ${error?'error':''}" role="status">${text}</div>`}
function go(id){
 if(!access[role].includes(id)){app.innerHTML='<h1>Acceso restringido</h1><p>Esta función no está disponible para el rol seleccionado.</p>';return;}
 if(id==='landing'){app.innerHTML=`<section class="hero"><p>Soporte técnico para empresas</p><h1>Tus equipos operativos. Tu empresa en marcha.</h1><p>Solicita mantenimiento y reparación, conoce al técnico asignado y controla la cobertura mensual.</p>${link('Conocer planes','landing')} ${link('Registrar empresa',1)} ${link('Ingresar',0)}</section><h1>Planes con cobertura definida</h1><div class="cards"><article><h2>Básico</h2><p>4 h correctivas y 1 mantenimiento al mes.</p><p>Precio por definir.</p></article><article><h2>Empresarial</h2><p>8 h correctivas y 2 mantenimientos al mes.</p><p>Precio por definir.</p></article><article><h2>Integral</h2><p>16 h correctivas y 4 mantenimientos al mes.</p><p>Precio por definir.</p></article><article><h2>Adicionales con autorización</h2><p>Los repuestos y excedentes requieren una cotización aprobada por la empresa.</p></article></div><h1>Cómo funciona</h1><p>Registra tu empresa, solicita atención, recibe soporte del técnico asignado y consulta el historial de tus equipos.</p><h1>Somos UniLink</h1><p>Startup académica enfocada en organizar el soporte técnico de las empresas.</p>`;return;}
 const [slug,title,r,items]=screens[id];app.innerHTML=`<p class="pill">${role} · Datos de demostración</p><h1>${title}</h1><div id="message" aria-live="polite"></div><div id="body"></div><div id="actions" class="actions"></div>`;
 const body=document.getElementById('body'),actions=document.getElementById('actions');
 if([0,1,2,5,11].includes(id)){
 const forms={0:[['Correo','email'],['Contraseña','password']],1:[['Razón social','text'],['RUC','text'],['Correo','email'],['Contraseña','password']],2:[['Correo','email']],5:[['Equipo','text'],['Ubicación','text'],['Problema','textarea']],11:[['Minutos trabajados','number'],['Solución aplicada','textarea']]};
 body.innerHTML='<form id="form">'+forms[id].map(([l,t])=>`<label>${l}${t==='textarea'?`<textarea required name="${l}"></textarea>`:`<input required name="${l}" type="${t}" ${t==='number'?'min="1" max="360"':''}>`}</label>`).join('')+'<button>Continuar</button></form>';
 document.getElementById('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(id===0){role='Responsable';document.getElementById('role').value=role;menu();go(3)}else if(id===5){state.created=true;message('Solicitud CC-004 registrada. Pendiente de asignación.');actions.innerHTML=link('Consultar solicitudes',4)}else if(id===11){message('Intervención enviada. El administrador debe validar el consumo.')}else if(id===2){message('Si el correo existe, se enviará un enlace de recuperación.')}else{message('Registro recibido en esta demostración. No se ha creado una cuenta real.')}};return;
 }
 body.innerHTML='<div class="cards">'+items.filter(x=>x[0]!=='Acción').map(([a,b])=>`<article><h2>${a}</h2><p>${b}</p></article>`).join('')+'</div>';
 if(id===3)actions.innerHTML=link('Ver solicitudes',4)+link('Revisar cotización',9);
 if(id===4){body.insertAdjacentHTML('afterbegin','<label>Buscar por código o equipo<input id="search" placeholder="Ejemplo: CC-001"></label><p id="results"></p>');document.getElementById('search').oninput=e=>document.getElementById('results').textContent= /cc-001|pc-014|^$/i.test(e.target.value)?'CC-001 · PC-014 · '+state.ticket:'No se encontraron solicitudes. Prueba con otro código.';actions.innerHTML=(role==='Empleado'?link('Nueva solicitud',5):'')+link('Abrir CC-001',6);if(state.created)message('CC-004 · Solicitud recién registrada · Pendiente de asignación')}
 if(id===6){message('Estado: '+state.ticket);if(role==='Responsable')actions.innerHTML=link('Revisar cotización',9);if(role==='Técnico')actions.innerHTML=link('Registrar intervención',11)}
 if(id===8)message('Saldo correctivo: '+state.balance+' minutos. Mantenimiento preventivo: 1 equipo disponible.');
 if(id===9){message('Cotización versión 1: '+state.quote);actions.innerHTML='<button onclick="decide(true)">Aprobar S/ 210.00</button><button class="secondary" onclick="decide(false)">Rechazar</button>'}
 if(id===10)actions.innerHTML=link('Abrir solicitud asignada',6)+link('Registrar intervención',11);
 if(id===12)actions.innerHTML='<button onclick="assignDemo()">Confirmar asignación</button>';
 if(id===13)actions.innerHTML='<button onclick="validate()">Validar 60 minutos y cerrar CC-003</button>';
 if(id===15)actions.innerHTML=link('Asignar técnico',12)+link('Validar atención',13);
}
function decide(approved){if(state.quote!=='Pendiente'){message('La cotización ya fue decidida. Reinicia la demo para probar otro resultado.',true);return}state.quote=approved?'Aprobada':'Rechazada';state.ticket=approved?'En atención':'En espera de aprobación';message(approved?'Aprobación registrada por S/ 210.00. Adicional autorizado.':'Rechazo registrado. No se autoriza el trabajo adicional.');}
function assignDemo(){state.assigned=true;message("Andrea asignada a CC-003.")}
function validate(){if(state.validated){message('Esta intervención ya fue validada. No se descontó nuevamente.',true);return}state.validated=true;state.balance-=60;message('CC-003 cerrada. Descontados 60 minutos. Saldo: '+state.balance+' minutos.');}
menu();go('landing');
</script></html>
