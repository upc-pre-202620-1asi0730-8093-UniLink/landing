function setLanguage(next){if(!['es','en'].includes(next))return;lang=next;try{localStorage.setItem('compucare-language',lang)}catch(e){}refreshLang();menu();go(currentPage)}
function choosePlan(plan){selectedPlan=plan;role='Visitante';document.getElementById('role').value=role;menu();go(1);const note=document.createElement('div');note.className='notice';note.textContent=(lang==='en'?'Selected plan: ':'Plan seleccionado: ')+({basic:lang==='en'?'Basic':'Básico',business:lang==='en'?'Business':'Empresarial',integral:'Integral'}[plan]);document.getElementById('message').appendChild(note)}
const originalMenu=menu;menu=function(){originalMenu();if(lang==='en'){const walker=document.createTreeWalker(nav,NodeFilter.SHOW_TEXT);let n;while((n=walker.nextNode())){const v=n.nodeValue.trim();if(tr.has(v))n.nodeValue=n.nodeValue.replace(v,translateText(v));}}};
const originalGo=go;go=function(id){originalGo(id);localizeDOM()};
const originalMessage=message;message=function(text,error=false){originalMessage(text,error);localizeDOM()};
[...document.getElementById('role').options].forEach(o=>o.value=o.textContent);
try{lang=localStorage.getItem('compucare-language')==='en'?'en':'es'}catch(e){}
refreshLang();

menu();go('landing');
</script></html>
